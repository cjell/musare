# Lint and the offline test suite, on every push and pull request.
#
# What runs here is exactly `pytest` with the defaults in pyproject.toml: the
# eval, llm and integration markers are deselected, so nothing spends money or
# needs a secret. The listening history and the corpus are gitignored, so tests
# that read them skip rather than fail - the run summary says how many.
#
# mypy is not a step yet. It reports existing errors, and a check that is red on
# every push teaches everyone to ignore the badge.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The ml extra too: the modes, regions and projection tests import
      # scikit-learn, and the map is the largest piece of work in the repo, so
      # CI running without it would leave out the part most worth testing.
      - name: Install
        run: python -m pip install -e ".[dev,ml]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest
